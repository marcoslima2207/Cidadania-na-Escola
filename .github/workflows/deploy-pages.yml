# Compila o frontend e publica o resultado no GitHub Pages.
name: Deploy Angular to GitHub Pages

# Executa quando há push na main ou quando o workflow é iniciado manualmente.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para ler o repositório e publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancela a execução anterior de Pages se chegar uma publicação mais recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # DEPLOY: compila o Angular e publica o artefato no GitHub Pages.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # npm ci usa as versões exatas registradas no package-lock.json.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Somente a chave pública de produção entra no frontend compilado.
      - name: Configure Clerk production
        if: ${{ vars.CLERK_PUBLISHABLE_KEY != '' }}
        working-directory: frontend
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: node scripts/configure-clerk.mjs --production

      # O Pages informa /repositorio no github.io e a raiz no domínio próprio.
      - name: Build Angular app
        working-directory: frontend
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${PAGES_BASE_PATH%/}/"

      # Permite carregar diretamente uma rota Angular quando o Pages procura uma página 404.
      - name: Add SPA fallback
        run: cp frontend/dist/frontend/browser/index.html frontend/dist/frontend/browser/404.html

      # Disponibiliza os arquivos compilados para o job de publicação.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    # Publica somente depois que o job build termina com sucesso.
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
