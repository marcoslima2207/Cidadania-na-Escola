# Define os recursos que o Render provisiona e a configuração do backend publicado.
services:
  # DEPLOY API: serviço Django executado pelo Render.
  - type: web
    name: cidadania-na-escola-api
    runtime: python
    rootDir: backend
    # Instala as bibliotecas e atualiza a estrutura do banco antes de iniciar o serviço.
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    # Executa a aplicação WSGI; a checagem de saúde consulta a raiz da API.
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/
    # Valores disponíveis em os.getenv no settings.py; credenciais vêm do banco vinculado.
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_ENGINE
        value: postgresql
      - key: DB_NAME
        fromDatabase:
          name: cidadania-na-escola-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: cidadania-na-escola-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cidadania-na-escola-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: cidadania-na-escola-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cidadania-na-escola-db
          property: port
      # Autoriza chamadas feitas pelo domínio do frontend no GitHub Pages.
      - key: CORS_ALLOWED_ORIGINS
        value: https://marcoslima2207.github.io

databases:
  # BANCO: PostgreSQL para manter usuários, posts, likes e comentários.
  - name: cidadania-na-escola-db
    plan: free
